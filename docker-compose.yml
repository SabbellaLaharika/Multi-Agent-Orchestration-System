version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: multiagent_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orchestrator_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orchestrator_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent_network

  redis:
    image: redis:7-alpine
    container_name: multiagent_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - agent_network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multiagent_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/orchestrator_db
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@db:5432/orchestrator_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY:-mock-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-key}
      - GROQ_API_KEY=${GROQ_API_KEY:-mock-key}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-mock-key}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-mock-key}
      - NEWS_API_KEY=${NEWS_API_KEY:-mock-key}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - agent_network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multiagent_worker
    command: celery -A app.worker.celery_app.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/orchestrator_db
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@db:5432/orchestrator_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - LLM_API_KEY=${LLM_API_KEY:-mock-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-key}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-mock-key}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY:-mock-key}
      - NEWS_API_KEY=${NEWS_API_KEY:-mock-key}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - agent_network

  ui:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multiagent_ui
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000
    depends_on:
      - api
    networks:
      - agent_network

volumes:
  postgres_data:

networks:
  agent_network:
    driver: bridge
